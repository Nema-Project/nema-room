name: CI

# Every PR reports one stable gate; main pushes do not duplicate the suite.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Classify complete diff
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PATH_LIST_FILE: ${{ runner.temp }}/changed-paths.json
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            node --input-type=module -e '
              import {writeFileSync} from "node:fs";
              writeFileSync(process.env.PATH_LIST_FILE, JSON.stringify([
                "README.md", "README.en.md", "README.zh.md", "README.ja.md",
                "SECURITY.md", "CONTRIBUTING.md", "AGENTS.md", "CHANGELOG.md", "ROADMAP.md",
                "docs/guide.en.md", "docs/guide.zh.md", "docs/guide.ja.md", "scripts/desktop/RELEASE.md"
              ]));'
          else
            node scripts/ci/changes.mjs "$BASE" "$HEAD"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/changed-paths.json
          if-no-files-found: error
          retention-days: 1

  docs:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-paths
      - run: node scripts/ci/docs-check.mjs "$RUNNER_TEMP/ci-paths/changed-paths.json"

  verify:
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    uses: ./.github/workflows/verify.yml
    with:
      checkout_ref: ${{ github.sha }}

  gate:
    name: CI gate
    if: always()
    needs: [classify, docs, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/ci/policy.mjs
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS: ${{ needs.docs.result }}
          VERIFY: ${{ needs.verify.result }}
