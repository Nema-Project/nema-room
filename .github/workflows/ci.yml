name: CI

# Branch pushes are covered by their pull request; only main runs on push.
# Root-level Markdown and docs/ do not affect any build or test. Markdown
# elsewhere (skills, vendor rules) is product content and still triggers CI.
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    paths-ignore: ['*.md', 'docs/**']

permissions:
  contents: read

# A newer commit on the same ref supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Normal runs take 1-4 minutes; the 360-minute default would let a hung test burn the monthly budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck -w apps/cli
      - run: node --test scripts/setup.test.mjs
      - run: node scripts/setup.mjs --help
      - name: Native credentials, command execution, and authentication
        run: npx vitest run apps/cli/test/platform.test.ts apps/cli/test/secrets/permissions.test.ts apps/cli/test/config.test.ts apps/cli/test/direct/authCommands.test.ts apps/cli/test/claude/adapter.test.ts packages/knowledge/test/store.test.ts packages/knowledge/test/history.test.ts --maxWorkers=2

  test:
    name: Full application tests and web build
    runs-on: ubuntu-latest
    # Normal runs take 8-12 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Spawned test fixtures resolve @nema/* through compiled output, so build it first.
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build -w apps/hub
      - run: npm run build -w apps/cli
      - run: npm run lint -w apps/web
      - run: npm run build -w apps/web
      - name: Check installer prerequisites
        run: npm run setup:check
      - name: Build and start the Compose stack
        run: npm run up
      - name: Wait for the hub and web UI
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4400/api/daemon/status >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100
          exit 1
      - name: Stop containers
        if: always()
        run: docker compose down
