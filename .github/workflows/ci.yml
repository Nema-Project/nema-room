name: CI

# Every PR reports one stable gate. Push to main and manual dispatch run the full suite.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      platform: ${{ steps.changes.outputs.platform }}
      npm_pack: ${{ steps.changes.outputs.npm_pack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Classify complete diff
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # github.sha is the merge commit this job checks out. A two-dot diff of the
          # branch head counts main's newer files when that head is behind base.
          HEAD: ${{ github.sha }}
          PATH_LIST_FILE: ${{ runner.temp }}/changed-paths.json
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            {
              echo 'mode=full'
              echo 'platform=true'
              echo 'npm_pack=true'
              echo 'desktop=false'
              echo 'image=false'
            } >> "$GITHUB_OUTPUT"
            node --input-type=module -e '
              import {writeFileSync} from "node:fs";
              writeFileSync(process.env.PATH_LIST_FILE, JSON.stringify([
                "README.md", "README.en.md", "README.zh.md", "README.ja.md",
                "SECURITY.md", "CONTRIBUTING.md", "AGENTS.md", "CHANGELOG.md", "ROADMAP.md",
                "docs/guide.en.md", "docs/guide.zh.md", "docs/guide.ja.md", "scripts/desktop/RELEASE.md"
              ]));'
          else
            node scripts/ci/changes.mjs "$BASE" "$HEAD"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/changed-paths.json
          if-no-files-found: error
          retention-days: 1

  docs:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-changed-paths
          path: ${{ runner.temp }}/ci-paths
      - run: node scripts/ci/docs-check.mjs "$RUNNER_TEMP/ci-paths/changed-paths.json"

  verify:
    needs: classify
    if: needs.classify.result == 'success'
    uses: ./.github/workflows/verify.yml
    with:
      checkout_ref: ${{ github.sha }}
      app_tests: ${{ needs.classify.outputs.mode != 'docs' }}
      platform: ${{ needs.classify.outputs.mode == 'full' || needs.classify.outputs.platform == 'true' }}
      npm_pack: ${{ needs.classify.outputs.mode == 'full' || needs.classify.outputs.npm_pack == 'true' }}

  gate:
    name: CI gate
    if: always()
    needs: [classify, docs, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/ci/policy.mjs
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS: ${{ needs.docs.result }}
          LINT: ${{ needs.verify.outputs.lint }}
          APP: ${{ needs.verify.outputs.app }}
          PLATFORM: ${{ needs.verify.outputs.platform }}
          NPM_PACK: ${{ needs.verify.outputs.npm_pack }}
          PLATFORM_REQUIRED: ${{ needs.classify.outputs.platform }}
          NPM_PACK_REQUIRED: ${{ needs.classify.outputs.npm_pack }}
