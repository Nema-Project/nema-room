name: Publish @nema-project/nema to npm

# Trusted publishing (OIDC). The filename is part of the npm trusted-publisher
# binding; do not rename it without changing the npm setting first.
# A v* tag push runs verify.yml, then packs and smokes the tarball and uploads
# it as the nema-tarball artifact. It does not publish.
# Publishing happens only when release-promote.yml dispatches this workflow on
# the tag with promote_run_id and expected_integrity. That dispatch skips verify
# and build, downloads the tag push run's nema-tarball (no repack), checks that
# the promote run is live on main and passed its Candidate preflight, and
# publishes only a tarball whose sha512 equals expected_integrity.
# A manual dispatch without those inputs packs and smokes and does not publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_run_id:
        description: Set by release-promote.yml only; empty means pack and smoke without publishing
        type: string
        default: ''
      expected_integrity:
        description: sha512 integrity of the tag push run tarball, set by release-promote.yml
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # actions/checkout       3d3c42e5aac5ba805825da76410c181273ba90b1  v7.0.1
  # actions/setup-node     949feb2413d6458794dcd2491c4babbbce0c15c1  v7.1.0
  # actions/upload-artifact   cf430e030ddbb5b0abf93d22962f4752f3646cd9  v7.0.2
  # actions/download-artifact 9000827ccba6bdab643e8b6fd33ac0654aef8333  v8.0.2
  NODE_VERSION: 22

jobs:
  verify:
    if: ${{ inputs.promote_run_id == '' }}
    uses: ./.github/workflows/verify.yml
    with:
      checkout_ref: ${{ github.sha }}

  build:
    name: Pack and smoke nema
    if: ${{ inputs.promote_run_id == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run cli:pack
      - name: Smoke packed CLI
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find dist-npm -name 'nema-project-nema-*.tgz' | head -n 1)
          test -n "$tarball"
          node scripts/npm/smoke-pack.mjs "$tarball"
      - name: Prepare local hub and daemon token
        shell: bash
        run: |
          set -euo pipefail
          npm run db:up
          ready=0
          for _ in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U nema -d nema >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          mkdir -p "$RUNNER_TEMP/nema-data"
          npm run build -w apps/hub
          NEMA_DATABASE_URL=postgres://nema:nema@127.0.0.1:5433/nema \
            NEMA_DATA_DIR="$RUNNER_TEMP/nema-data" \
            NEMA_HUB_PORT=4400 \
            nohup node apps/hub/dist/src/main.js >"$RUNNER_TEMP/hub.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hub.pid"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4400/api/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hub.log"
          exit 1
      - name: Smoke daemon against the hub
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find dist-npm -name 'nema-project-nema-*.tgz' | head -n 1)
          node scripts/npm/smoke-pack.mjs "$tarball" --hub-url http://127.0.0.1:4400 --token-file "$RUNNER_TEMP/nema-data/daemon-token"
          node scripts/npm/smoke-pack.mjs "$tarball" --hub-url http://127.0.0.1:4400 --token-file "$RUNNER_TEMP/nema-data/daemon-token" --expect-skew
      - name: Upload packed tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nema-tarball
          if-no-files-found: error
          retention-days: 5
          path: |
            dist-npm/nema-project-nema-*.tgz
            scripts/npm/check-tag.mjs
            scripts/desktop/release-version.mjs
            scripts/release/npm-state.mjs
            apps/cli/package.json
            apps/desktop/package.json
            apps/local/package.json
      - name: Stop hub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/hub.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hub.pid")" || true
          fi
          docker compose down

  publish:
    name: Publish to npm
    # Only release-promote reaches this job: a dispatch on a tag ref that names a promote run.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.promote_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 15
    # One registry queue across versions; never cancel a publish in flight.
    concurrency:
      group: npm-publish-registry
      cancel-in-progress: false
    steps:
      - name: Check the promote run and find the tag push run
        id: origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
          EXPECTED_INTEGRITY: ${{ inputs.expected_integrity }}
        run: |
          set -euo pipefail
          [[ "$PROMOTE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "promote_run_id must be a run id" >&2; exit 1; }
          [[ "$EXPECTED_INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+=*$ ]] || { echo "expected_integrity must be sha512-<base64>" >&2; exit 1; }
          # Only a live release-promote run on main, past its Candidate preflight, may publish.
          promote=$(gh api "repos/${REPO}/actions/runs/${PROMOTE_RUN_ID}")
          test "$(jq -r .path <<<"$promote")" = ".github/workflows/release-promote.yml" || { echo "run ${PROMOTE_RUN_ID} is not release-promote" >&2; exit 1; }
          test "$(jq -r .head_branch <<<"$promote")" = "main" || { echo "release-promote run ${PROMOTE_RUN_ID} is not on main" >&2; exit 1; }
          test "$(jq -r .status <<<"$promote")" = "in_progress" || { echo "release-promote run ${PROMOTE_RUN_ID} is not in progress" >&2; exit 1; }
          preflight=$(gh api "repos/${REPO}/actions/runs/${PROMOTE_RUN_ID}/jobs" --jq '[.jobs[].steps[] | select(.name == "Candidate preflight") | .conclusion] | join(",")')
          test "$preflight" = "success" || { echo "release-promote run ${PROMOTE_RUN_ID} has no successful Candidate preflight (${preflight:-none})" >&2; exit 1; }
          # The tarball comes from this tag's push run: same commit, verify and build both succeeded.
          push_run=$(gh api "repos/${REPO}/actions/workflows/npm-publish.yml/runs?event=push&head_sha=${SHA}&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_branch == \"${TAG}\" and .conclusion == \"success\")] | sort_by(.id) | last | .id // empty")
          test -n "$push_run" || { echo "no successful push run of npm-publish for ${TAG} at ${SHA}" >&2; exit 1; }
          # A tag push runs the complete verify.yml: every verify job must have run and passed, none skipped.
          jobs=$(gh api "repos/${REPO}/actions/runs/${push_run}/jobs?per_page=100")
          # Like promote.mjs assertPushRunJobs: a failed job on a page this answer does not hold would go unseen.
          counts=$(jq -r '"\(.jobs | length) \(.total_count // "none")"' <<<"$jobs")
          if [ "$(jq '(.total_count | type) == "number" and (.jobs | length) == .total_count' <<<"$jobs")" != true ]; then
            echo "push run ${push_run}: the jobs answer lists ${counts% *} of ${counts#* } jobs" >&2
            exit 1
          fi
          for job in 'Pack and smoke nema' 'verify / Workflow lint' 'verify / Full application tests and web build' 'verify / Platform checks' 'verify / npm pack smoke'; do
            ok=$(jq --arg job "$job" '[.jobs[] | select(.name | startswith($job))] | (length > 0) and all(.conclusion == "success")' <<<"$jobs")
            test "$ok" = true || { echo "push run ${push_run}: ${job} did not run and pass" >&2; exit 1; }
          done
          ok=$(jq '[.jobs[] | select(.name | startswith("verify / "))] | all(.conclusion == "success")' <<<"$jobs")
          test "$ok" = true || { echo "push run ${push_run}: a verify job did not pass" >&2; exit 1; }
          echo "push_run=${push_run}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nema-tarball
          path: artifact
          run-id: ${{ steps.origin.outputs.push_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install an npm CLI that supports trusted publishing
        run: npm install -g npm@11.6.2
      - name: Confirm the tag and publish the packed tarball
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          EXPECTED_INTEGRITY: ${{ inputs.expected_integrity }}
        run: |
          set -euo pipefail
          git init --quiet gate
          git -C gate remote add origin "https://github.com/${REPO}.git"
          # Resolve refs only. This is not a source checkout: the job still publishes the downloaded tarball.
          auth=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth=(-c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}")
          fi
          git -C gate "${auth[@]}" fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          got=$(git -C gate rev-parse "refs/tags/${TAG}^{}")
          if [ "$got" != "$SHA" ]; then
            echo "tag moved: ${TAG} is ${got}, expected ${SHA}" >&2
            exit 1
          fi
          git -C gate "${auth[@]}" fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git -C gate merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          meta=$(node artifact/scripts/npm/check-tag.mjs "$TAG")
          dist=$(node -e 'const tag=JSON.parse(process.argv[1]).distTag; if(tag!=="latest"&&tag!=="next") throw new Error("unexpected dist-tag"); process.stdout.write(tag)' "$meta")
          version="${TAG#v}"
          tarball=$(find artifact/dist-npm -name 'nema-project-nema-*.tgz' | head -n 1)
          test -n "$tarball"
          got_integrity=$(node artifact/scripts/release/npm-state.mjs --integrity "$tarball")
          if [ "$got_integrity" != "$EXPECTED_INTEGRITY" ]; then
            echo "push run tarball is ${got_integrity}, release-promote expected ${EXPECTED_INTEGRITY}" >&2
            exit 1
          fi
          # absent -> publish; same -> already done; different -> refuse (exit 3); cannot tell -> fail (exit 2).
          state=$(node artifact/scripts/release/npm-state.mjs "$version" "$EXPECTED_INTEGRITY")
          if [ "$state" = same ]; then
            echo "${version} is already on npm with the expected tarball"
            exit 0
          fi
          test "$state" = absent
          # Re-read the channel dist-tag right before publishing. A failed read fails the step (set -e):
          # an unreadable tag is never treated as older. A stable version older than latest goes to
          # maintenance; a prerelease older than next is refused, since next would move backwards.
          current=$(npm view @nema-project/nema "dist-tags.${dist}")
          if [ -n "$current" ] && node --input-type=module -e 'import { compareReleaseVersions } from "./artifact/scripts/desktop/release-version.mjs"; process.exit(compareReleaseVersions(process.argv[1], process.argv[2]) > 0 ? 0 : 1)' "$current" "$version"; then
            if [ "$dist" = latest ]; then
              dist=maintenance
            else
              echo "npm ${dist} is ${current}, newer than ${version}; refusing to move it backwards" >&2
              exit 1
            fi
          fi
          # The tag can move after the check above. Fetch it again in this same step, immediately before publish.
          git -C gate "${auth[@]}" fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          got=$(git -C gate rev-parse "refs/tags/${TAG}^{}")
          if [ "$got" != "$SHA" ]; then
            echo "tag moved: ${TAG} is ${got}, expected ${SHA}" >&2
            exit 1
          fi
          if ! npm publish --provenance --access public --tag "$dist" "./$tarball"; then
            # A concurrent publish of the same tarball also counts as done; anything else fails.
            state=$(node artifact/scripts/release/npm-state.mjs "$version" "$EXPECTED_INTEGRITY")
            test "$state" = same
          fi
