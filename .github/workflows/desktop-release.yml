name: Desktop release

# Desktop targets are win32-x64 and darwin-arm64; Intel Macs are not supported.
# Desktop builds are the most expensive runs (macOS minutes bill at 10x), so
# branch pushes do not trigger them. A pull request builds and smokes both
# targets only when it changes apps/desktop or a non-Markdown file under
# scripts/desktop. Markdown directly in that folder or in a subfolder does
# not. A lockfile-only or workflow-only change waits for the release tag
# or a manual dispatch. A manual dispatch builds the chosen target(s).
# Only a push of a v<SemVer> tag
# reaches the publish job, which fails closed unless every target built, smoked
# and passed desktop:validate-release. The publish job stops at a verified
# draft; release-promote.yml publishes it after npm and the images verify.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/desktop/**'
      - '!scripts/desktop/**/*.md'
      # Together with the pattern above: Markdown in a subfolder, and a file directly in the folder.
      - '!scripts/desktop/*.md'
  workflow_dispatch:
    inputs:
      target:
        description: Desktop target(s) to build and smoke
        type: choice
        options: [all, win32-x64, darwin-arm64]
        default: all
      verify_full:
        description: Run complete verification before a nonpublishing rehearsal
        type: boolean
        default: false

permissions:
  contents: read

# One run per ref; a tag run is never cancelled so a second attempt on the same
# tag waits instead of racing the first publication.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Every action below is pinned to a full commit SHA; the comment records the tag it was resolved from.
  # actions/checkout       3d3c42e5aac5ba805825da76410c181273ba90b1  v7.0.1
  # actions/setup-node     949feb2413d6458794dcd2491c4babbbce0c15c1  v7.1.0
  # actions/upload-artifact   cf430e030ddbb5b0abf93d22962f4752f3646cd9  v7.0.2
  # actions/download-artifact 9000827ccba6bdab643e8b6fd33ac0654aef8333  v8.0.2
  NODE_VERSION: 22

jobs:
  plan:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      verification_required: ${{ steps.commit.outputs.verification_required }}
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      matrix: ${{ steps.targets.outputs.matrix }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve immutable release commit
        id: commit
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_REF: ${{ github.ref }}
          EVENT_COMMIT: ${{ github.sha }}
          VERIFY_FULL: ${{ inputs.verify_full }}
        run: |
          set -euo pipefail
          commit="$EVENT_COMMIT"
          required=false
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            git fetch --no-tags origin "+$TAG_REF:$TAG_REF"
            commit=$(node scripts/desktop/release-commit.mjs "$TAG_REF" refs/remotes/origin/main)
            if [ "$commit" != "$EVENT_COMMIT" ]; then
              echo 'Tag moved since the triggering event; refusing publication.' >&2
              exit 1
            fi
            required=true
          elif [ "$VERIFY_FULL" = "true" ]; then
            required=true
          fi
          test "$(git rev-parse HEAD)" = "$commit"
          echo "Verified checkout candidate: $commit"
          {
            echo "commit=$commit"
            echo "verification_required=$required"
          } >> "$GITHUB_OUTPUT"
      - name: Release helper tests
        run: node --test scripts/desktop/release-commit.test.mjs scripts/desktop/release.test.mjs scripts/release-notes.test.mjs
      - name: Resolve version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            # Rejects anything but strict v<SemVer> that equals the desktop and local package versions.
            result=$(node scripts/desktop/release-version.mjs "$REF_NAME")
            {
              echo "release=true"
              echo "version=$(node -p "JSON.parse(process.argv[1]).version" "$result")"
              echo "prerelease=$(node -p "JSON.parse(process.argv[1]).prerelease" "$result")"
            } >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./apps/desktop/package.json').version")
            {
              echo "release=false"
              echo "version=$version"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Select targets
        id: targets
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # A tag and a pull request build every target; publish needs all of them.
          # A dispatch can pick one target while fixing a single platform.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            wanted="$REQUESTED"
          else
            wanted=all
          fi
          matrix=$(node -e '
            const all = [
              { target: "win32-x64", platform: "win32", arch: "x64", runner: "windows-latest", installer: "exe" },
              { target: "darwin-arm64", platform: "darwin", arch: "arm64", runner: "macos-15", installer: "dmg" },
            ];
            const wanted = process.argv[1].split(",");
            const include = wanted.includes("all") ? all : all.filter((t) => wanted.includes(t.target));
            if (include.length === 0) throw new Error("No desktop target matches " + process.argv[1]);
            console.log(JSON.stringify({ include }));
          ' "$wanted")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Require changelog notes
        # A tag with no user-facing notes fails here, before either installer is built.
        if: steps.version.outputs.release == 'true'
        run: node scripts/release-notes.mjs --check CHANGELOG.md "${{ steps.version.outputs.version }}"

  verify:
    needs: plan
    if: needs.plan.outputs.verification_required == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.commit }}

  build:
    name: Build and smoke (${{ matrix.target }})
    needs: [plan, verify]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          (needs.verify.result == 'success' ||
           (needs.plan.outputs.verification_required == 'false' && needs.verify.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}
      - name: Put temporary files on the workspace disk
        # The checkout already lives on the runner's scratch disk, but TEMP still points at the
        # slow system disk. Staging runs two npm installs under os.tmpdir(). RUNNER_TEMP follows
        # the workspace, including runners that have no D: drive.
        if: matrix.platform == 'win32'
        shell: powershell
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          echo "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          echo "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check native Windows C toolchain
        if: matrix.platform == 'win32'
        shell: bash
        run: clang --version
      - name: Stage runtime payload
        shell: bash
        run: npm run desktop:stage -- --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --out dist/desktop
      - name: Report payload sizes
        shell: bash
        run: node scripts/desktop/payload-size.mjs "dist/desktop/$TARGET"
      - name: Collect source materials
        # Needs the upstream source archives; only a release attempt pays for it. A failure blocks the release.
        if: needs.plan.outputs.release == 'true'
        shell: bash
        run: npm run desktop:collect-source-materials -- "dist/desktop/$TARGET" "dist/desktop/$TARGET" "$TARGET" "$VERSION" scripts/desktop/source-materials-plan.json
      - name: Package desktop artifacts
        shell: bash
        # make.mjs always runs electron-builder with --publish never.
        # Windows emits the NSIS installer and a separate portable ZIP of the unpacked app.
        run: npm run desktop:make -- --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --staged "dist/desktop/$TARGET" --out "dist/desktop-artifacts/$TARGET"
      - name: Smoke packaged app (Windows NSIS installer)
        if: matrix.platform == 'win32'
        shell: bash
        run: npm run desktop:smoke -- --installer "dist/desktop-artifacts/$TARGET/Nema-$VERSION-$TARGET.exe"
      - name: Smoke packaged app (Windows portable ZIP)
        if: matrix.platform == 'win32'
        shell: bash
        run: npm run desktop:smoke -- --zip "dist/desktop-artifacts/$TARGET/Nema-$VERSION-$TARGET.zip"
      - name: Smoke staged runtime (macOS)
        # Windows smoke installs the NSIS package and, separately, extracts the portable ZIP. macOS gets the staged-payload runtime smoke only.
        if: matrix.platform == 'darwin'
        shell: bash
        run: npm run desktop:smoke-runtime -- "dist/desktop/$TARGET"
      - name: Checksums and upload set
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop/release-manifest.mjs checksums "dist/desktop-artifacts/$TARGET" "$VERSION" "$TARGET"
          node scripts/desktop/release-manifest.mjs verify "dist/desktop-artifacts/$TARGET" "$VERSION" "$TARGET"
          mkdir -p "release-upload/$TARGET"
          cp "dist/desktop-artifacts/$TARGET/Nema-$VERSION-$TARGET.${{ matrix.installer }}" "release-upload/$TARGET/"
          if [ "${{ matrix.platform }}" = "win32" ]; then
            cp "dist/desktop-artifacts/$TARGET/Nema-$VERSION-$TARGET.zip" "release-upload/$TARGET/"
          fi
          cp "dist/desktop-artifacts/$TARGET/SHA256SUMS-$VERSION-$TARGET.txt" "release-upload/$TARGET/"
      - name: Upload release assets and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nema-release-${{ needs.plan.outputs.version }}-${{ matrix.target }}
          path: release-upload/${{ matrix.target }}
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.release == 'true' && 14 || 3 }}
      - name: Upload staged payload for release validation
        if: needs.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nema-payload-${{ needs.plan.outputs.version }}-${{ matrix.target }}
          path: dist/desktop/${{ matrix.target }}
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [plan, verify, build]
    # needs on a matrix job waits for every target; any failed target skips this job.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.release == 'true' &&
          needs.plan.result == 'success' && needs.verify.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nema-*-${{ needs.plan.outputs.version }}-*
          path: downloaded
      - name: Arrange per-target inputs
        shell: bash
        run: |
          set -euo pipefail
          for target in win32-x64 darwin-arm64; do
            mkdir -p release-input release-payloads
            mv "downloaded/nema-release-$VERSION-$target" "release-input/$target"
            mv "downloaded/nema-payload-$VERSION-$target" "release-payloads/$target"
          done
      - name: Validate every target payload (fails closed)
        shell: bash
        run: |
          set -euo pipefail
          for target in win32-x64 darwin-arm64; do
            npm run desktop:validate-release -- "release-payloads/$target" "$target" "$VERSION"
          done
      - name: Stamp the Compose asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compose-asset
          node scripts/images/stamp-compose.mjs "$VERSION" compose-asset/docker-compose.yml

      - name: Verify the complete asset set
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          node scripts/desktop/release-manifest.mjs collect release-input release-assets "$VERSION" "$PRERELEASE" compose-asset/docker-compose.yml
      - name: Recheck remote tag before draft operations
        shell: bash
        run: node scripts/desktop/release-commit.mjs --verify-remote "refs/tags/$TAG" "$RELEASE_COMMIT"
      - name: Refuse a published tag and validate any earlier draft
        shell: bash
        run: |
          set -euo pipefail
          if view=$(gh release view "$TAG" --json isDraft,assets 2>/dev/null); then
            if [ "$(node -p "JSON.parse(process.argv[1]).isDraft" "$view")" != "true" ]; then
              echo "Release $TAG is already published; refusing to overwrite it." >&2
              exit 1
            fi
            # A draft from a failed attempt is reused only when it holds nothing but assets of this release.
            for existing in $(node -p "JSON.parse(process.argv[1]).assets.map((a) => a.name).join(' ')" "$view"); do
              if [ ! -f "release-assets/$existing" ]; then
                echo "Draft $TAG holds unexpected asset $existing; refusing to reuse it." >&2
                exit 1
              fi
            done
            echo "DRAFT_EXISTS=true" >> "$GITHUB_ENV"
          fi
      - name: Write release notes
        shell: bash
        run: node scripts/release-notes.mjs CHANGELOG.md "$VERSION" "$RELEASE_COMMIT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > release-notes.md
      - name: Create or reuse draft and upload
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop/release-commit.mjs --verify-remote "refs/tags/$TAG" "$RELEASE_COMMIT"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); fi
          if [ "${DRAFT_EXISTS:-false}" != "true" ]; then
            gh release create "$TAG" --draft --verify-tag --title "Nema Room $VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            gh release edit "$TAG" --title "Nema Room $VERSION" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          # The draft must hold exactly the verified asset set; release-promote.yml publishes it later.
          expected=$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort | tr '\n' ' ')
          if [ "$expected" != "$actual" ]; then
            echo "Draft assets differ from the verified set: $actual" >&2
            exit 1
          fi
          # Upload/validation can take time; re-read the remote ref before reporting the draft ready.
          node scripts/desktop/release-commit.mjs --verify-remote "refs/tags/$TAG" "$RELEASE_COMMIT"
          echo "Draft $TAG holds the verified asset set; run release-promote.yml to publish it."
