name: 安全问题
description: 凭证、路径或本地接口方面的漏洞。不要粘贴密钥或利用步骤。
body:
  - type: markdown
    attributes:
      value: |
        本仓库是私有的，GitHub 的 `/security/advisories/new` 会返回 404。请用这个模板。

        只写影响。不要粘贴令牌、`.env`、`auth.json`、daemon token，也不要写利用步骤。维护者需要样本时会再问。
  - type: textarea
    id: impact
    attributes:
      label: 影响
      description: 说明谁能因此读到或改到不该接触的数据。不要附复现命令。
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: commit SHA
      description: 出问题的版本。不确定可留空。
      placeholder: abc1234
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我没有写入令牌、`.env`、`auth.json`、daemon token 或利用步骤
          required: true
