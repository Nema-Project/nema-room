name: 功能建议
description: 提议一项本机使用范围内的改动
body:
  - type: markdown
    attributes:
      value: |
        中文、English、日本語都可以。

        当前首版是可在本机完整使用的应用。多设备同步、备份和团队只读查看留到本地基本实现完成之后。建议请落在现有讨论、知识、代码上下文或开发交接上。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你在本机使用时遇到的具体情景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 描述里没有密钥、仓库地址中的凭据或他人的私人数据
          required: true
