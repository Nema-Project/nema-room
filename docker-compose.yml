# `npm run db:up`  -> only postgres (for `npm run dev`, published on 127.0.0.1:5433)
# `npm run up`     -> postgres + hub + web (run mode); the nema daemon still runs on the host:
#                     npm run build -w apps/cli && npx nema daemon
# Every port is published on 127.0.0.1 only.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nema
      POSTGRES_PASSWORD: nema
      POSTGRES_DB: nema
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nema-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nema -d nema"]
      interval: 2s
      timeout: 5s
      retries: 30

  hub:
    build:
      context: .
      target: hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Files the hub writes into the bind mount (daemon-token, knowledge repos) must be readable by the
    # host user running `nema daemon`. Docker Desktop maps ownership itself; on Linux set NEMA_UID/NEMA_GID
    # to `id -u` / `id -g` if they are not 1000.
    user: "${NEMA_UID:-1000}:${NEMA_GID:-1000}"
    environment:
      NEMA_DATABASE_URL: postgres://nema:nema@postgres:5432/nema
      NEMA_DATA_DIR: /data
      NEMA_HUB_HOST: 0.0.0.0
      # Container port == published host port, so the Host guard (127.0.0.1:<port> / localhost:<port>)
      # and the hub URL handed to the daemon match what the host sees.
      NEMA_HUB_PORT: ${NEMA_HUB_PORT:-4400}
      NEMA_WEB_ORIGIN: ${NEMA_WEB_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      # The hub cannot see the host's ~/.nema/ws; the daemon removes those dirs itself.
      NEMA_HUB_CLEAN_DAEMON_DIRS: "0"
    ports:
      - "127.0.0.1:${NEMA_HUB_PORT:-4400}:${NEMA_HUB_PORT:-4400}"
    volumes:
      # Same directory the host daemon reads its daemon-token from (default ~/.nema/data).
      - ${NEMA_DATA_HOST_DIR:-${HOME}/.nema/data}:/data

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_HUB_URL: ${NEXT_PUBLIC_HUB_URL:-http://127.0.0.1:4400}
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  nema-pg:
