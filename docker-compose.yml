# `npm run db:up`  -> only postgres (for `npm run dev`, published on 127.0.0.1:5433)
# `docker compose up` -> pull the pinned hub and web images. No source checkout required.
# `npm run up`     -> merge docker-compose.build.yml and build from this checkout.
# The nema daemon still runs on the host: npm run build -w apps/cli && npx nema daemon
# Every port is published on 127.0.0.1 only.
#
# NEMA_HUB_PORT (default 4400) is both the published host port and the port the hub
# listens on, because the browser's Host header is that published port.
# NEMA_WEB_PORT (default 3000) is only the published host port; the container still
# listens on 3000. NEMA_HUB_URL defaults to http://127.0.0.1:$NEMA_HUB_PORT and is
# read when the web container starts, so the published image does not need a rebuild.
# Set NEMA_HUB_URL only when the browser reaches the hub at a different address.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nema
      POSTGRES_PASSWORD: nema
      POSTGRES_DB: nema
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nema-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nema -d nema"]
      interval: 2s
      timeout: 5s
      retries: 30

  hub:
    image: ghcr.io/nema-project/nema-room-hub:0.1.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Files the hub writes into the bind mount (daemon-token, knowledge repos) must be readable by the
    # host user running `nema daemon`. Docker Desktop maps ownership itself; on Linux set NEMA_UID/NEMA_GID
    # to `id -u` / `id -g` if they are not 1000.
    user: "${NEMA_UID:-1000}:${NEMA_GID:-1000}"
    environment:
      NEMA_DATABASE_URL: postgres://nema:nema@postgres:5432/nema
      NEMA_DATA_DIR: /data
      NEMA_HUB_HOST: 0.0.0.0
      NEMA_HUB_PORT: ${NEMA_HUB_PORT:-4400}
      NEMA_WEB_ORIGIN: http://localhost:${NEMA_WEB_PORT:-3000},http://127.0.0.1:${NEMA_WEB_PORT:-3000}
      # The hub cannot see the host's ~/.nema/ws; the daemon removes those dirs itself.
      NEMA_HUB_CLEAN_DAEMON_DIRS: "0"
    ports:
      - "127.0.0.1:${NEMA_HUB_PORT:-4400}:${NEMA_HUB_PORT:-4400}"
    volumes:
      # Same directory the host daemon reads its daemon-token from (default ~/.nema/data).
      - ${NEMA_DATA_HOST_DIR:-${HOME}/.nema/data}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.NEMA_HUB_PORT||4400)+'/api/daemon/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    image: ghcr.io/nema-project/nema-room-web:0.1.4
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      NEMA_HUB_URL: ${NEMA_HUB_URL:-http://127.0.0.1:${NEMA_HUB_PORT:-4400}}
    ports:
      - "127.0.0.1:${NEMA_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  nema-pg:
