# This compose file is a template, not an installable version.
# For public installation use the supported Release docker-compose.yml asset.
# Source development builds this tree with npm run up.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nema
      POSTGRES_PASSWORD: nema
      POSTGRES_DB: nema
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nema-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nema -d nema"]
      interval: 2s
      timeout: 5s
      retries: 30

  hub:
    image: ghcr.io/nema-project/nema-room-hub:${NEMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Files the hub writes into the bind mount (daemon-token, knowledge repos) must be readable by the
    # host user running `nema daemon`. Docker Desktop maps ownership itself; on Linux set NEMA_UID/NEMA_GID
    # to `id -u` / `id -g` if they are not 1000.
    user: "${NEMA_UID:-1000}:${NEMA_GID:-1000}"
    environment:
      NEMA_DATABASE_URL: postgres://nema:nema@postgres:5432/nema
      NEMA_DATA_DIR: /data
      NEMA_HUB_HOST: 0.0.0.0
      NEMA_HUB_PORT: ${NEMA_HUB_PORT:-4400}
      NEMA_WEB_ORIGIN: http://localhost:${NEMA_WEB_PORT:-3000},http://127.0.0.1:${NEMA_WEB_PORT:-3000}
      # The hub cannot see the host's ~/.nema/ws; the daemon removes those dirs itself.
      NEMA_HUB_CLEAN_DAEMON_DIRS: "0"
    ports:
      - "127.0.0.1:${NEMA_HUB_PORT:-4400}:${NEMA_HUB_PORT:-4400}"
    volumes:
      # Same directory the host daemon reads its daemon-token from (default ~/.nema/data).
      - ${NEMA_DATA_HOST_DIR:-${HOME}/.nema/data}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.NEMA_HUB_PORT||4400)+'/api/daemon/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    image: ghcr.io/nema-project/nema-room-web:${NEMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      NEMA_HUB_URL: ${NEMA_HUB_URL:-http://127.0.0.1:${NEMA_HUB_PORT:-4400}}
    ports:
      - "127.0.0.1:${NEMA_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  nema-pg:
